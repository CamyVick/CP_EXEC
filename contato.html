<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solicitar diagnóstico de migração | VoxBridge by CP Exec</title><meta name="description" content="Conte sobre sua migração de plataforma de contact center e agende um diagnóstico com a CP Exec.">
<link rel="canonical" href="https://www.cpexec.com.br/contato.html">
<meta property="og:type" content="website"><meta property="og:locale" content="pt_BR"><meta property="og:site_name" content="VoxBridge by CP Exec">
<meta property="og:title" content="Solicitar diagnóstico de migração | VoxBridge by CP Exec"><meta property="og:description" content="Conte sobre sua migração de plataforma de contact center e agende um diagnóstico com a CP Exec."><meta property="og:url" content="https://www.cpexec.com.br/contato.html">
<meta name="theme-color" content="#070A1C"><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vox.css"></head><body>
<a class="skip" href="#main">Pular para o conteúdo</a><div id="site-header"></div><main id="main">
<section class="light" style="padding-top:64px"><div class="wrap"><h1 style="color:var(--text);font-size:clamp(30px,4vw,46px)">Solicitar diagnóstico</h1>
<p class="mute" style="margin:16px 0 32px">Pedimos só o necessário para entender sua migração.</p>
<form id="leadForm" novalidate>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<input type="hidden" name="_subject" value="Novo diagnóstico VoxBridge"><input type="hidden" name="_captcha" value="false">
<label>Nome<input name="nome" required autocomplete="name"></label>
<label>E-mail corporativo<input name="email" type="email" required autocomplete="email"></label>
<label>Empresa<input name="empresa" required autocomplete="organization"></label>
<label>Cargo<input name="cargo" required autocomplete="organization-title"></label>
<label>Plataforma atual<input name="plataforma_atual" required></label>
<label>Plataforma de destino (se houver)<input name="plataforma_destino"></label>
<label>Principal problema<textarea name="problema" rows="4" required></textarea></label>
<label>Previsão de migração (opcional)<input name="previsao" placeholder="ex.: 3º trimestre"></label>
<label style="font-weight:400;display:flex;gap:10px"><input type="checkbox" name="consentimento" required style="margin-top:4px">Concordo com o uso destes dados para contato sobre o diagnóstico, conforme a <a href="privacidade.html">Política de Privacidade</a>.</label>
<button class="btn btn-p" type="submit">Solicitar diagnóstico</button>
<div class="msg ok" id="ok" role="status">Recebemos sua solicitação. Entraremos em contato por e-mail.</div>
<div class="msg err" id="err" role="alert">Não foi possível enviar. Tente novamente ou escreva para cpexec.dados@gmail.com.</div>
</form></div></section></main><div id="site-footer"></div><script src="js/vox.js"></script></body></html>
